version: "3.9"

services:
  redis:
    image: redis:alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - gateway-network

  user-service:
    build:
      context: .
      dockerfile: services/user_service/Dockerfile
    container_name: user-service
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - gateway-network

  product-service:
    build:
      context: .
      dockerfile: services/product_service/Dockerfile
    container_name: product-service
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks:
      - gateway-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USER_SERVICE_URL=http://user-service:8001
      - PRODUCT_SERVICE_URL=http://product-service:8002
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - gateway-network

networks:
  gateway-network:
    driver: bridge